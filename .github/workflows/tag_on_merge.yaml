name: Tag on merge

on:
  push:
    branches:
      - main

jobs:
  tag-updated-addons:
    name: Tag addons with bumped versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          token: ${{ secrets.TAG_PUSH_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Find changed config.yaml files
        id: find_addons
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed_config_files=$(git diff --name-only HEAD^ HEAD | grep -E '^[^/]+/config\.(json|ya?ml)$' || true)
          else
            changed_config_files=""
          fi
          echo "Changed config files: $changed_config_files"
          changed_addons=$(printf '%s' "$changed_config_files" | awk -F/ '{print $1}' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "changed_addons=$changed_addons" >> "$GITHUB_OUTPUT"

      - name: Tag each changed addon
        if: steps.find_addons.outputs.changed_addons != '[]'
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for slug in $(echo '${{ steps.find_addons.outputs.changed_addons }}' | jq -r '.[]'); do
            updater_json="${slug}/updater.json"
            if [ -f "$updater_json" ] && [ "$(jq -r '.paused // false' "$updater_json")" = "true" ]; then
              echo "$slug: updater paused, skipping auto-tag"
              continue
            fi

            version=$(yq -r '.version' "${slug}/config.yaml")
            if [ -z "$version" ] || [ "$version" = "null" ]; then
              echo "::warning::$slug: no version found in config.yaml, skipping"
              continue
            fi

            tag="${slug}@${version}"
            if git rev-parse "refs/tags/$tag" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
              echo "$slug: tag $tag already exists, skipping"
              continue
            fi

            echo "$slug: tagging $tag"
            git tag "$tag"
            git push origin "$tag"
          done

      - name: Regenerate README add-on table
        run: uv run --with pyyaml python3 .github/scripts/regenerate_readme_table.py

      - name: Open README sync PR if changed
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "README.md unchanged, nothing to do"
            exit 0
          fi

          BRANCH="bot/sync-readme"

          # main is protected (PR required), so this can never push
          # directly. If a sync PR is already open, add this run's
          # change on top of it instead of opening a second one.
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$EXISTING_PR" ]; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            uv run --with pyyaml python3 .github/scripts/regenerate_readme_table.py
            if [ -z "$(git status --porcelain README.md)" ]; then
              echo "README.md matches existing sync PR #$EXISTING_PR, nothing to add"
              exit 0
            fi
            git add README.md
            git commit -m "bot: sync README add-on table"
            git push origin "$BRANCH"
            echo "Updated existing PR #$EXISTING_PR"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "bot: sync README add-on table"
          git push --force origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "bot: sync README add-on table" \
            --body "Regenerates the add-on table in README.md from each addon's config.yaml. Opened automatically because main is protected and this workflow can no longer push directly."
