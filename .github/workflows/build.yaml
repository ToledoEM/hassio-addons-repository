name: Build add-on images

on:
  push:
    tags:
      - "bentopdf-*"
      - "manyfold_solo-*"
      - "stirling_pdf_fat-*"
      - "stirling_pdf_full-*"
      - "stirling_pdf_ultra_lite-*"
      - "nginx_webserver_proxy-*"
  workflow_dispatch:
    inputs:
      addon:
        description: 'Addon to build'
        required: false
        type: choice
        options:
          - all
          - bentopdf
          - manyfold_solo
          - stirling_pdf_fat
          - stirling_pdf_full
          - stirling_pdf_ultra_lite
          - nginx_webserver_proxy

env:
  REGISTRY: ghcr.io

jobs:
  bentopdf:
    name: Build bentopdf
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref_name, 'bentopdf-') ||
      (github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'bentopdf'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bentopdf
        uses: home-assistant/builder@2026.03.2
        with:
          args: |
            --amd64 \
            --aarch64 \
            -t bentopdf \
            --docker-hub ${{ env.REGISTRY }}/${{ github.repository_owner }}

  manyfold_solo:
    name: Build manyfold_solo
    runs-on: ubuntu-latest
