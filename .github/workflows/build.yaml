# yamllint disable rule:line-length
---
name: Build add-on images

on:
  push:
    tags:
      - "bentopdf-*"
      - "bentopdf@*"
      - "cataloguecanvas-*"
      - "cataloguecanvas@*"
      - "manyfold_solo-*"
      - "manyfold_solo@*"
      - "stirling_pdf_fat-*"
      - "stirling_pdf_fat@*"
      - "stirling_pdf_full-*"
      - "stirling_pdf_full@*"
      - "stirling_pdf_ultra_lite-*"
      - "stirling_pdf_ultra_lite@*"
      - "nginx_webserver_proxy-*"
      - "nginx_webserver_proxy@*"
      - "obsidian_syncserver_solo-*"
      - "obsidian_syncserver_solo@*"
      - "obsidian_syncserver_ssl-*"
      - "obsidian_syncserver_ssl@*"
      - "obsidian_syncserver_npm-*"
      - "obsidian_syncserver_npm@*"
  workflow_dispatch:
    inputs:
      addon:
        description: 'Addon to build'
        required: false
        type: choice
        options:
          - all
          - bentopdf
          - cataloguecanvas
          - manyfold_solo
          - stirling_pdf_fat
          - stirling_pdf_full
          - stirling_pdf_ultra_lite
          - nginx_webserver_proxy
          - obsidian_syncserver_solo
          - obsidian_syncserver_ssl
          - obsidian_syncserver_npm

jobs:
  build:
    name: ${{ matrix.addon }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    strategy:
      fail-fast: false
      matrix:
        addon:
          - bentopdf
          - cataloguecanvas
          - manyfold_solo
          - stirling_pdf_fat
          - stirling_pdf_full
          - stirling_pdf_ultra_lite
          - nginx_webserver_proxy
          - obsidian_syncserver_solo
          - obsidian_syncserver_ssl
          - obsidian_syncserver_npm
        arch:
          - amd64
          - aarch64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read add-on metadata
        id: meta
        run: |
          VERSION=$(grep '^version:' ${{ matrix.addon }}/config.yaml | awk '{print $2}' | tr -d '"')
          IMAGE=$(grep '^image:' ${{ matrix.addon }}/config.yaml | awk '{print $2}' | tr -d '"' | sed 's/{arch}/${{ matrix.arch }}/g')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push bentopdf
        if: matrix.addon == 'bentopdf' && (startsWith(github.ref_name, 'bentopdf') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'bentopdf'))
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: bentopdf
          image: ${{ steps.meta.outputs.image }}
          image-tags: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          build-args: BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.23
          cache-gha: "false"
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the app from source (React SPA + Python runtime) rather than
      # layering on a prebuilt upstream image, so this is the slowest build here.
      # BUILD_FROM is unused by the Dockerfile — it starts FROM python:3.14-alpine
      # — but the builder action requires the arg, and pr-check.yaml requires a
      # matching per-arch build_from entry in build.yaml.
      - name: Build and push cataloguecanvas
        if: matrix.addon == 'cataloguecanvas' && (startsWith(github.ref_name, 'cataloguecanvas') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'cataloguecanvas'))
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: cataloguecanvas
          image: ${{ steps.meta.outputs.image }}
          image-tags: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          build-args: BUILD_FROM=python:3.14-alpine
          cache-gha: "false"
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manyfold_solo
        if: matrix.addon == 'manyfold_solo' && (startsWith(github.ref_name, 'manyfold_solo') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'manyfold_solo'))
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: manyfold_solo
          image: ${{ steps.meta.outputs.image }}
          image-tags: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          build-args: BUILD_FROM=ghcr.io/manyfold3d/manyfold-solo:latest
          cache-gha: "false"
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push stirling_pdf_fat
        if: matrix.addon == 'stirling_pdf_fat' && (startsWith(github.ref_name, 'stirling_pdf_fat') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'stirling_pdf_fat'))
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: stirling_pdf_fat
          image: ${{ steps.meta.outputs.image }}
          image-tags: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          build-args: BUILD_FROM=stirlingtools/stirling-pdf:latest-fat
          cache-gha: "false"
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push stirling_pdf_full
        if: matrix.addon == 'stirling_pdf_full' && (startsWith(github.ref_name, 'stirling_pdf_full') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'stirling_pdf_full'))
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: stirling_pdf_full
          image: ${{ steps.meta.outputs.image }}
          image-tags: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          build-args: BUILD_FROM=stirlingtools/stirling-pdf:latest
          cache-gha: "false"
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push stirling_pdf_ultra_lite
        if: matrix.addon == 'stirling_pdf_ultra_lite' && (startsWith(github.ref_name, 'stirling_pdf_ultra_lite') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'stirling_pdf_ultra_lite'))
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: stirling_pdf_ultra_lite
          image: ${{ steps.meta.outputs.image }}
          image-tags: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          build-args: BUILD_FROM=stirlingtools/stirling-pdf:latest-ultra-lite
          cache-gha: "false"
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull nginx base image
        if: matrix.addon == 'nginx_webserver_proxy' && (startsWith(github.ref_name, 'nginx_webserver_proxy') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'nginx_webserver_proxy'))
        run: docker pull jc21/nginx-proxy-manager:latest

      - name: Build and push nginx_webserver_proxy
        if: matrix.addon == 'nginx_webserver_proxy' && (startsWith(github.ref_name, 'nginx_webserver_proxy') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'nginx_webserver_proxy'))
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: nginx_webserver_proxy
          image: ${{ steps.meta.outputs.image }}
          image-tags: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          build-args: BUILD_FROM=jc21/nginx-proxy-manager:latest
          cache-gha: "false"
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push obsidian_syncserver_solo
        if: matrix.addon == 'obsidian_syncserver_solo' && (startsWith(github.ref_name, 'obsidian_syncserver_solo') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'obsidian_syncserver_solo'))
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: obsidian_syncserver_solo
          image: ${{ steps.meta.outputs.image }}
          image-tags: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          build-args: BUILD_FROM=couchdb:3.5.2
          cache-gha: "false"
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push obsidian_syncserver_ssl
        if: matrix.addon == 'obsidian_syncserver_ssl' && (startsWith(github.ref_name, 'obsidian_syncserver_ssl') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'obsidian_syncserver_ssl'))
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: obsidian_syncserver_ssl
          image: ${{ steps.meta.outputs.image }}
          image-tags: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          build-args: BUILD_FROM=couchdb:3.5.2
          cache-gha: "false"
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      # Merges two upstream images, so both are pulled before the build.
      - name: Pre-pull obsidian_syncserver_npm base images
        if: matrix.addon == 'obsidian_syncserver_npm' && (startsWith(github.ref_name, 'obsidian_syncserver_npm') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'obsidian_syncserver_npm'))
        run: |
          docker pull jc21/nginx-proxy-manager:latest
          docker pull couchdb:3.5.2

      - name: Build and push obsidian_syncserver_npm
        if: matrix.addon == 'obsidian_syncserver_npm' && (startsWith(github.ref_name, 'obsidian_syncserver_npm') || github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'obsidian_syncserver_npm'))
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: obsidian_syncserver_npm
          image: ${{ steps.meta.outputs.image }}
          image-tags: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          build-args: BUILD_FROM=jc21/nginx-proxy-manager:latest
          cache-gha: "false"
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
