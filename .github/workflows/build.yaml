          image-tags: ${{ needs.stirling_pdf_ultra_lite-init.outputs.version }}
          version: ${{ needs.stirling_pdf_ultra_lite-init.outputs.version }}
          build-args: |
            BUILD_FROM=stirlingtools/stirling-pdf:latest-ultra-lite
            HA_BASE=${{ matrix.arch == 'amd64' && 'ghcr.io/home-assistant/amd64-base:3.23' || 'ghcr.io/home-assistant/aarch64-base:3.23' }}
