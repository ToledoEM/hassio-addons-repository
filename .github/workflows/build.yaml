name: Build add-on images

on:
  push:
    tags:
      - "bentopdf-*"
      - "bentopdf@*"
      - "manyfold_solo-*"
      - "manyfold_solo@*"
      - "stirling_pdf_fat-*"
      - "stirling_pdf_fat@*"
      - "stirling_pdf_full-*"
      - "stirling_pdf_full@*"
      - "stirling_pdf_ultra_lite-*"
      - "stirling_pdf_ultra_lite@*"
      - "nginx_webserver_proxy-*"
      - "nginx_webserver_proxy@*"
  workflow_dispatch:
    inputs:
      addon:
        description: 'Addon to build'
        required: false
        type: choice
        options:
          - all
          - bentopdf
          - manyfold_solo
          - stirling_pdf_fat
          - stirling_pdf_full
          - stirling_pdf_ultra_lite
          - nginx_webserver_proxy

env:
  REGISTRY: ghcr.io
  ARCHITECTURES: '["amd64", "aarch64"]'

jobs:
  # ── bentopdf ────────────────────────────────────────────────────────────────
  bentopdf-init:
    name: bentopdf / init matrix
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref_name, 'bentopdf-') ||
      (github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'bentopdf'))
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' bentopdf/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: bentopdf
          registry-prefix: ghcr.io/toledoem

  bentopdf-build:
    name: bentopdf / build ${{ matrix.arch }}
    needs: bentopdf-init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bentopdf-init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and push bentopdf (${{ matrix.arch }})
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: bentopdf
          image: ${{ matrix.image }}
          image-tags: ${{ needs.bentopdf-init.outputs.version }}
          version: ${{ needs.bentopdf-init.outputs.version }}
          build-args: BUILD_FROM=${{ fromJSON('{"amd64":"ghcr.io/home-assistant/amd64-base:3.23","aarch64":"ghcr.io/home-assistant/aarch64-base:3.23"}')[matrix.arch] }}
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  bentopdf-manifest:
    name: bentopdf / publish manifest
    needs: [bentopdf-init, bentopdf-build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: bentopdf
          image-tags: ${{ needs.bentopdf-init.outputs.version }}
          registry-prefix: ghcr.io/toledoem
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag arch-specific images (bentopdf-amd64, bentopdf-aarch64)
        env:
          VERSION: ${{ needs.bentopdf-init.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/toledoem/amd64-bentopdf:${VERSION}
          docker tag ghcr.io/toledoem/amd64-bentopdf:${VERSION} ghcr.io/toledoem/bentopdf-amd64:${VERSION}
          docker push ghcr.io/toledoem/bentopdf-amd64:${VERSION}
          docker pull ghcr.io/toledoem/aarch64-bentopdf:${VERSION}
          docker tag ghcr.io/toledoem/aarch64-bentopdf:${VERSION} ghcr.io/toledoem/bentopdf-aarch64:${VERSION}
          docker push ghcr.io/toledoem/bentopdf-aarch64:${VERSION}

  # ── manyfold_solo ────────────────────────────────────────────────────────────
  manyfold_solo-init:
    name: manyfold_solo / init matrix
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref_name, 'manyfold_solo-') ||
      (github.event_name == 'workflow_dispatch' && (inputs.addon == 'all' || inputs.addon == 'manyfold_solo'))
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' manyfold_solo/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: manyfold_solo
          registry-prefix: ghcr.io/toledoem

  manyfold_solo-build:
    name: manyfold_solo / build ${{ matrix.arch }}
    needs: manyfold_solo-init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manyfold_solo-init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and push manyfold_solo (${{ matrix.arch }})
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: manyfold_solo
          image: ${{ matrix.image }}
          image-tags: ${{ needs.manyfold_solo-init.outputs.version }}
          version: ${{ needs.manyfold_solo-init.outputs.version }}
          build-args: BUILD_FROM=ghcr.io/manyfold3d/manyfold-solo:latest
          cosign: "false"
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  manyfold_solo-manifest:
    name: manyfold_solo / publish manifest
    needs: [manyfold_solo-init, manyfold_solo-build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: manyfold_solo
          image-tags: ${{ needs.manyfold_solo-init.outputs.version }}
          registry-prefix: ghcr.io/toledoem
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag arch-specific images (manyfold_solo-amd64, manyfold_solo-aarch64)
        env:
          VERSION: ${{ needs.manyfold_solo-init.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/toledoem/amd64-manyfold_solo:${VERSION}
          docker tag ghcr.io/toledoem/amd64-manyfold_solo:${VERSION} ghcr.io/toledoem/manyfold_solo-amd64:${VERSION}
          docker push ghcr.io/toledoem/manyfold_solo-amd64:${VERSION}
          docker pull ghcr.io/toledoem/aarch64-manyfold_solo:${VERSION}
          docker tag ghcr.io/toledoem/aarch64-manyfold_solo:${VERSION} ghcr.io/toledoem/manyfold_solo-aarch64:${VERSION}
          docker push ghcr.io/toledoem/manyfold_solo-aarch64:${VERSION}

  # ── stirling_pdf_fat ─────────────────────────────────────────────────────────
