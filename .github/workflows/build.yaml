    steps:
      - uses: actions/checkout@v5
      - name: Build and push stirling_pdf_fat (${{ matrix.arch }})
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: stirling_pdf_fat
          image: ${{ matrix.image }}
          image-tags: ${{ needs.stirling_pdf_fat-init.outputs.version }}
          version: ${{ needs.stirling_pdf_fat-init.outputs.version }}
