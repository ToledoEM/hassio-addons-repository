name: "Obsidian Sync Server"
slug: obsidian_syncserver_solo
description: "Self-hosted Obsidian LiveSync backend on CouchDB. Plain HTTP — put your own reverse proxy in front for TLS."
version: "3.5.2"
url: "https://github.com/ToledoEM/hassio-addons-repository/tree/main/obsidian_syncserver_solo"
arch:
  - amd64
  - aarch64
startup: services
init: false

ports:
  5984/tcp: 5984
ports_description:
  5984/tcp: "CouchDB HTTP — add a reverse proxy for mobile Obsidian"

webui: "http://[HOST]:[PORT:5984]/_utils"

panel_icon: mdi:notebook-outline
panel_title: Obsidian Sync

map:
  - addon_config:rw

options:
  username: admin
  password: ""
  database: obsidian
  log_level: info

schema:
  username: str
  password: password?
  database: match(^[a-z][a-z0-9_$()+/-]*$)
  log_level: list(debug|info|warn|error)

image: "ghcr.io/toledoem/obsidian_syncserver_solo-{arch}"
